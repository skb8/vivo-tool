name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия в формате x.x.x (например 1.2.3)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Release APK ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check version format
        run: |
          if ! echo "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Версия '$VERSION' не в формате x.x.x или vx.x.x"
            exit 1
          fi
          CLEAN_VERSION="${VERSION#v}"
          TAG="v${CLEAN_VERSION}"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — подписать релиз нечем"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VIVO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VIVO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIVO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIVO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace -PvivoVersion="$CLEAN_VERSION"

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          RELEASE_APK="vivo-tool-${TAG}.apk"
          cp "$APK_FILE" "$RELEASE_APK"
          gh release create "$TAG" "$RELEASE_APK" \
            --title "Vivo Tool $TAG" \
            --generate-notes

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: vivo-tool-${{ env.TAG }}
          path: vivo-tool-*.apk
          if-no-files-found: error
