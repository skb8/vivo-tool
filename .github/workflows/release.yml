name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия в формате x.x.x (например 1.2.3)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Release APK ${{ inputs.version }}
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check version format
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Версия '$VERSION' не в формате x.x.x"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — подписать релиз нечем"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VIVO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VIVO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIVO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIVO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace -PvivoVersion="$VERSION"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: vivo-tool-${{ inputs.version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
